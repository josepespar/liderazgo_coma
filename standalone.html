<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>El Liderazgo que Transforma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@1,400;1,700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
/* ═══════════════════════════════════════════════════════════
   style.css — El Liderazgo que Transforma
   Sistema visual completo: paleta, HUD, actividades, gaming UI
═══════════════════════════════════════════════════════════ */

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #FFFFFF;
  --text:      #2C2C2C;
  --text-sec:  #5A5A5A;
  --accent:    #1A6EFF;
  --accent-dk: #0A3D8F;
  --accent-lt: #5AB4FF;
  --bg-act:    #F0F4FF;
  --border:    #D0DCF8;
  --success:   #27AE60;
  --error:     #C0392B;
  --warning:   #E67E22;

  /* Character colours */
  --jordi: #1A6EFF;
  --jack:  #C0392B;
  --elena: #8E44AD;
  --gery:  #27AE60;
  --marc:  #E67E22;
  --nadia: #16A085;

  --font-body:  'Inter', 'Segoe UI', sans-serif;
  --font-quote: 'Playfair Display', Georgia, serif;
  --font-ui:    'Roboto Mono', 'Courier New', monospace;

  --radius: 10px;
  --shadow: 0 2px 12px rgba(26,110,255,0.10);
  --transition: 0.25s ease;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ════════════════════════════════════════════════
   HUD SUPERIOR
════════════════════════════════════════════════ */
#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: var(--bg);
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
  gap: 16px;
}

#hud-left, #hud-right {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 180px;
}
#hud-right { justify-content: flex-end; }

#hud-center { flex: 1; text-align: center; }

#hud-course-title {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-sec);
  text-transform: uppercase;
}

.hud-label {
  font-family: var(--font-ui);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-sec);
  text-transform: uppercase;
}

.hud-value {
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 500;
  color: var(--accent-dk);
}

#hud-progress-track {
  width: 120px;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

#hud-progress-bar {
  height: 100%;
  width: 10%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.6s ease;
}

/* ════════════════════════════════════════════════
   LAYOUT
════════════════════════════════════════════════ */
#layout {
  display: flex;
  min-height: 100vh;
  padding-top: 56px;
}

/* ── Sidebar Izquierda: Temperatura ── */
#temp-sidebar {
  position: fixed;
  left: 0;
  top: 56px;
  bottom: 0;
  width: 60px;
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 12px;
  z-index: 90;
}

.sidebar-label {
  font-family: var(--font-ui);
  font-size: 8px;
  letter-spacing: 0.12em;
  color: var(--text-sec);
  text-transform: uppercase;
  writing-mode: horizontal-tb;
}

#temp-bar-track {
  flex: 1;
  width: 12px;
  background: var(--border);
  border-radius: 6px;
  display: flex;
  flex-direction: column-reverse;
  overflow: hidden;
  max-height: 200px;
}

#temp-fill {
  width: 100%;
  height: 60%;
  background: var(--warning);
  border-radius: 6px;
  transition: height 0.8s ease, background-color 0.8s ease;
}

#temp-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

#temp-icon { font-size: 16px; }
#temp-label {
  font-family: var(--font-ui);
  font-size: 7px;
  color: var(--text-sec);
  text-align: center;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}

/* ── Panel Derecho: Minimapa + Tracker ── */
#right-panel {
  position: fixed;
  right: 0;
  top: 56px;
  bottom: 0;
  width: 100px;
  background: var(--bg);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 8px;
  gap: 16px;
  z-index: 90;
  overflow-y: auto;
}

#minimap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 100%;
}

.mm-tree {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 100%;
}

.mm-node {
  font-family: var(--font-ui);
  font-size: 9px;
  padding: 3px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-sec);
  background: var(--bg);
  cursor: default;
  transition: all var(--transition);
  width: 80%;
  text-align: center;
}

.mm-node.mm-current {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 0 8px rgba(26,110,255,0.4);
}

.mm-node.mm-visited {
  background: var(--bg-act);
  border-color: var(--accent-lt);
  color: var(--accent-dk);
}

.mm-node.mm-star { border-color: var(--accent-dk); font-weight: bold; }
.mm-node.mm-branch { opacity: 0.5; font-style: italic; }

.mm-connector {
  width: 1px;
  height: 8px;
  background: var(--border);
}

.mm-fork {
  display: flex;
  gap: 4px;
  justify-content: center;
}

.mm-branch-a, .mm-branch-b {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

/* Tracker */
#decision-tracker-block {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-top: auto;
}

#decision-tracker {
  display: flex;
  gap: 4px;
}

.dt-icon {
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 700;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-act);
  color: var(--accent-dk);
  border: 1px solid var(--border);
  cursor: help;
}

/* ── Main Scene Area ── */
#scene-container {
  flex: 1;
  margin-left: 60px;
  margin-right: 100px;
  padding: 40px 48px;
  max-width: 900px;
  width: 100%;
  align-self: flex-start;
  min-height: calc(100vh - 56px);
}

/* ════════════════════════════════════════════════
   TRANSICIONES DE ESCENA
════════════════════════════════════════════════ */
.scene-exit {
  animation: fadeOut 0.3s ease forwards;
}
.scene-enter {
  animation: fadeIn 0.4s ease forwards;
}

@keyframes fadeOut {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(-8px); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Special cold effect E03 */
.scene-cold {
  background: linear-gradient(180deg, #f8f9ff 0%, #ffffff 100%);
  transition: background 1.5s ease;
}

/* ════════════════════════════════════════════════
   SCENE ELEMENTS
════════════════════════════════════════════════ */

/* Emotion icon tag */
.emotion-tag {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--bg-act);
  color: var(--accent-dk);
  border: 1px solid var(--border);
  margin-bottom: 12px;
  letter-spacing: 0.06em;
}

.emotion-tension     { border-color: var(--jack); color: var(--jack); }
.emotion-resistencia { border-color: var(--marc); color: var(--marc); }
.emotion-quiebre     { border-color: var(--elena); color: var(--elena); }
.emotion-apertura    { border-color: var(--gery); color: var(--gery); }
.emotion-reconexion  { border-color: var(--nadia); color: var(--nadia); }
.emotion-transformacion { border-color: var(--accent-dk); color: var(--accent-dk); }

.scene-header { margin-bottom: 28px; }

.scene-title {
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent-dk);
  line-height: 1.2;
  margin-bottom: 6px;
}

.scene-act {
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--text-sec);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* Narrative */
.narrative { margin-bottom: 28px; }

.narrative p {
  margin-bottom: 14px;
  font-size: 1.05rem;
  color: var(--text);
}

/* Character voice colours */
.jack-voice  { color: var(--jack); font-style: italic; display: block; padding: 10px 14px; background: rgba(192,57,43,0.05); border-left: 3px solid var(--jack); margin: 8px 0; border-radius: 0 var(--radius) var(--radius) 0; }
.jordi-thought { color: var(--jordi); font-style: italic; display: block; padding: 10px 14px; background: rgba(26,110,255,0.05); border-left: 3px solid var(--jordi); margin: 8px 0; border-radius: 0 var(--radius) var(--radius) 0; }

/* Pedagogical Block */
.pedagogical-block {
  background: var(--bg-act);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 28px;
}

.pb-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent-dk);
  margin-bottom: 16px;
  font-family: var(--font-ui);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 0.85rem;
}

.pedagogical-block ol {
  padding-left: 20px;
}

.pedagogical-block ol li {
  margin-bottom: 10px;
  font-size: 0.97rem;
  color: var(--text);
  line-height: 1.55;
}

/* Quote */
.scene-quote {
  font-family: var(--font-quote);
  font-style: italic;
  font-size: 1.15rem;
  color: var(--accent-dk);
  border-left: 4px solid var(--accent);
  padding: 12px 20px;
  margin: 0 0 28px 0;
  background: rgba(10,61,143,0.04);
  border-radius: 0 var(--radius) var(--radius) 0;
}

/* Hook line */
.hook-line {
  font-family: var(--font-quote);
  font-style: italic;
  font-size: 1rem;
  color: var(--accent-dk);
  text-align: center;
  padding: 20px 0 8px;
  opacity: 0.75;
}

/* ════════════════════════════════════════════════
   ACTIVIDADES
════════════════════════════════════════════════ */

.activity-wrapper {
  background: var(--bg-act);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
}

.activity-prompt {
  font-weight: 600;
  font-size: 1rem;
  color: var(--accent-dk);
  margin-bottom: 18px;
}

/* Thermometer */
.thermometer-activity {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.thermo-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
  transition: all var(--transition);
  text-align: left;
  font-family: var(--font-body);
}

.thermo-btn:hover {
  border-color: var(--accent-lt);
  background: rgba(90,180,255,0.08);
}

.thermo-btn.selected {
  border-color: var(--accent);
  background: rgba(26,110,255,0.08);
}

.thermo-num {
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--accent);
  min-width: 24px;
}

.thermo-label { color: var(--text); font-size: 0.9rem; }

/* Decision / Dialogue */
.decision-activity {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.decision-btn {
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--text);
  text-align: left;
  transition: all var(--transition);
  line-height: 1.4;
}

.decision-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: rgba(26,110,255,0.06);
  transform: translateX(3px);
}

.decision-btn.selected {
  border-color: var(--accent);
  background: rgba(26,110,255,0.1);
  color: var(--accent-dk);
  font-weight: 600;
}

.decision-btn:disabled { cursor: not-allowed; opacity: 0.6; }

/* Countdown */
.countdown-bar {
  width: 100%;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 12px;
  position: relative;
}

.countdown-fill {
  height: 100%;
  width: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width 1s linear;
}

.countdown-label {
  display: block;
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--text-sec);
  margin-top: 4px;
  margin-bottom: 8px;
  text-align: right;
}

/* Feedback */
.feedback-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  margin-top: 12px;
  animation: slideDown 0.3s ease;
}

.feedback-text {
  font-size: 0.92rem;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.55;
}

.feedback-concept {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--accent-dk);
  background: var(--bg-act);
  padding: 6px 10px;
  border-radius: 6px;
  margin-top: 8px;
}

.option-text-display {
  font-size: 0.9rem;
  color: var(--text-sec);
  padding: 10px 14px;
  border-left: 3px solid var(--accent-lt);
  margin: 8px 0;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Quiz */
.quiz-activity { display: flex; flex-direction: column; gap: 10px; }

.quiz-btn {
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.92rem;
  color: var(--text);
  text-align: left;
  transition: all var(--transition);
  line-height: 1.4;
}

.quiz-btn:hover:not(:disabled) {
  border-color: var(--accent-lt);
  background: rgba(90,180,255,0.07);
}

.quiz-btn.correct {
  border-color: var(--success);
  background: rgba(39,174,96,0.1);
  color: #1a5c35;
  font-weight: 600;
}

.quiz-btn.incorrect {
  border-color: var(--error);
  background: rgba(192,57,43,0.08);
  color: #7b1e1e;
}

.quiz-btn.correct-reveal {
  border-color: var(--success);
  background: rgba(39,174,96,0.06);
  opacity: 0.7;
}

.quiz-btn:disabled { cursor: not-allowed; }

/* DragDrop */
.dragdrop-activity { display: flex; flex-direction: column; gap: 12px; }

.dd-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dd-item {
  padding: 12px 16px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 0.92rem;
  cursor: grab;
  transition: all var(--transition);
  user-select: none;
}

.dd-item:hover { border-color: var(--accent-lt); background: rgba(90,180,255,0.06); }
.dd-item.dd-selected { border-color: var(--accent); background: rgba(26,110,255,0.1); cursor: pointer; }
.dd-item.dragging { opacity: 0.5; cursor: grabbing; }

.dd-hint {
  font-size: 0.8rem;
  color: var(--text-sec);
  font-style: italic;
}

/* Subtext */
.subtext-activity { display: flex; flex-direction: column; gap: 16px; }

.subtext-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}

.subtext-name {
  display: block;
  font-size: 0.95rem;
  color: var(--accent-dk);
  margin-bottom: 6px;
}

.subtext-reaction {
  font-size: 0.88rem;
  color: var(--text-sec);
  font-style: italic;
  margin-bottom: 10px;
}

.subtext-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.subtext-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg-act);
  cursor: pointer;
  font-size: 0.82rem;
  color: var(--text);
  font-family: var(--font-body);
  transition: all var(--transition);
}

.subtext-btn:hover { border-color: var(--accent-lt); }
.subtext-btn.selected { background: rgba(26,110,255,0.12); border-color: var(--accent); color: var(--accent-dk); }
.subtext-btn.correct { background: rgba(39,174,96,0.12); border-color: var(--success); color: #1a5c35; }
.subtext-btn.incorrect { background: rgba(192,57,43,0.08); border-color: var(--error); color: #7b1e1e; }

/* Word Anchor */
.word-anchor-activity {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}

.word-btn {
  padding: 10px 18px;
  border: 2px solid var(--border);
  border-radius: 24px;
  background: var(--bg);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--text);
  transition: all var(--transition);
}

.word-btn:hover { border-color: var(--accent-lt); background: rgba(90,180,255,0.08); }
.word-btn.selected { border-color: var(--accent); background: rgba(26,110,255,0.1); color: var(--accent-dk); font-weight: 600; }

.word-anchor-result {
  margin-top: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 0.92rem;
  animation: slideDown 0.3s ease;
  width: 100%;
}

/* Info activity */
.info-activity { display: flex; justify-content: center; }

/* ════════════════════════════════════════════════
   BOTONES GLOBALES
════════════════════════════════════════════════ */

.btn-next {
  display: inline-block;
  margin-top: 16px;
  padding: 12px 28px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition), transform var(--transition);
}

.btn-next:hover { background: var(--accent-dk); transform: translateY(-1px); }

.btn-next.btn-large {
  padding: 16px 36px;
  font-size: 1.05rem;
}

.btn-confirm {
  margin-top: 10px;
  padding: 10px 22px;
  background: var(--bg);
  color: var(--accent);
  border: 2px solid var(--accent);
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}

.btn-confirm:hover:not(:disabled) { background: var(--accent); color: #fff; }
.btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

/* ════════════════════════════════════════════════
   CAMINO ALTERNATIVO
════════════════════════════════════════════════ */

.alt-path-card {
  border: 1px dashed var(--accent-lt);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 24px;
  background: rgba(240,244,255,0.6);
}

.alt-path-toggle {
  background: none;
  border: none;
  color: var(--accent);
  font-family: var(--font-ui);
  font-size: 0.85rem;
  cursor: pointer;
  padding: 0;
  letter-spacing: 0.04em;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.alt-path-toggle:hover { color: var(--accent-dk); }

.alt-path-content {
  margin-top: 14px;
  animation: slideDown 0.3s ease;
}

.alt-path-content.hidden { display: none; }

.alt-path-title {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--accent-dk);
  margin-bottom: 10px;
  font-family: var(--font-ui);
  text-transform: uppercase;
  font-size: 0.8rem;
  letter-spacing: 0.06em;
}

.alt-path-content p {
  font-size: 0.92rem;
  color: var(--text);
  line-height: 1.65;
}

/* ════════════════════════════════════════════════
   BADGE NOTIFICATION
════════════════════════════════════════════════ */

.badge-notification {
  position: fixed;
  top: 70px;
  right: 16px;
  background: var(--bg);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow);
  z-index: 200;
  opacity: 0;
  transform: translateX(20px);
  transition: all 0.4s ease;
  max-width: 280px;
}

.badge-notification.show {
  opacity: 1;
  transform: translateX(0);
}

.badge-icon { font-size: 1.3rem; }
.badge-label { font-size: 0.82rem; color: var(--text); }
.badge-label strong { color: var(--accent-dk); }

/* ════════════════════════════════════════════════

.scene-final { animation: fadeIn 0.6s ease; }

.results-screen {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding-bottom: 48px;
}

.results-profile-title {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-sec);
}

.results-profile-name {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent-dk);
  padding: 10px 0 6px;
}

.profile-transformacional { color: var(--accent); }
.profile-situacional { color: var(--gery); }
.profile-correctivo { color: var(--marc); }
.profile-reactivo { color: var(--jack); }

.results-score-bar {
  width: 100%;
  height: 12px;
  background: var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.results-score-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 6px;
  transition: width 1s ease;
}

.results-score-label {
  font-family: var(--font-ui);
  font-size: 0.88rem;
  color: var(--text-sec);
}

.results-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.badge-display {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg-act);
  font-size: 0.82rem;
  color: var(--accent-dk);
}

.results-text {
  font-size: 0.97rem;
  line-height: 1.7;
  color: var(--text);
  background: var(--bg-act);
  padding: 20px 24px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.results-concept {
  font-size: 0.88rem;
  color: var(--text-sec);
  font-family: var(--font-ui);
}

.results-action {
  font-size: 0.92rem;
  color: var(--text);
  background: rgba(39,174,96,0.07);
  border: 1px solid rgba(39,174,96,0.3);
  border-radius: var(--radius);
  padding: 14px 18px;
}

.results-endquestion {
  font-family: var(--font-quote);
  font-style: italic;
  font-size: 1.1rem;
  color: var(--accent-dk);
  border-left: 4px solid var(--accent);
  padding: 10px 18px;
}

.alt-paths-summary {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.alt-paths-summary h4 {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-sec);
  margin-bottom: 14px;
}

.alt-path-mini {
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
  font-size: 0.88rem;
  color: var(--text-sec);
  background: var(--bg);
}

.alt-path-mini strong { color: var(--text); }
.alt-path-mini small { font-family: var(--font-ui); font-size: 0.78rem; }
.alt-path-mini p { margin-top: 6px; line-height: 1.45; }
.alt-path-mini.highlight { border-color: var(--accent); background: rgba(26,110,255,0.06); }
.alt-path-mini.highlight strong { color: var(--accent-dk); }

.btn-restart {
  padding: 13px 28px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--text-sec);
  transition: all var(--transition);
  align-self: flex-start;
}

.btn-restart:hover { border-color: var(--accent); color: var(--accent); }

@media (max-width: 900px) {
  #temp-sidebar, #right-panel { display: none; }
  #scene-container { margin-left: 0; margin-right: 0; padding: 24px 20px; }
  .scene-title { font-size: 1.5rem; }
  #hud-progress-track { width: 80px; }

  #hud-left, #hud-right { min-width: unset; }
  #scene-container { padding: 20px 16px; }
}

  /* ══════════════════════════════════════════════════════
     UTILIDADES DOM
  ══════════════════════════════════════════════════════ */
  function el(id) { return document.getElementById(id); }
  function make(tag, cls) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    return e;
  }
  function emotionIconLabel(icon) {
    var map = {
      tension: '⚡ Tensión', apertura: '◎ Apertura', resistencia: '◈ Resistencia',
      quiebre: '◆ Quiebre', reconexion: '◉ Reconexión', transformacion: '✦ Transformación'
    };
    return map[icon] || icon;
  }

  /* ══════════════════════════════════════════════════════
     UTILIDADES DE ESTADO
  ══════════════════════════════════════════════════════ */
  function unlockBadge(badgeId) {
    if (STATE.badgesUnlocked.indexOf(badgeId) === -1) {
      STATE.badgesUnlocked.push(badgeId);
      showBadgeNotification(badgeId);
    }
  }

  function updateLeadershipProfile() {
    if (STATE.score >= 90) STATE.leadershipProfile = 'transformacional';
    else if (STATE.score >= 70) STATE.leadershipProfile = 'situacional';
    else if (STATE.score >= 50) STATE.leadershipProfile = 'correctivo';
    else STATE.leadershipProfile = 'reactivo';
  }

  function getEpilogueKey() {
    if (STATE.score >= 90) return 'A';
    if (STATE.score >= 70) return 'B';
    if (STATE.score >= 50) return 'C';
    return 'D';
  }

  function saveAndAdvance(nextSceneId) {
    STATE.currentScene = nextSceneId;
    SCORM.saveState(STATE);
    renderScene(nextSceneId);
  }

  /* ══════════════════════════════════════════════════════
     HUD
  ══════════════════════════════════════════════════════ */
  function updateHUD() {
    var scene = SCENES[STATE.currentScene];
    var idx = (scene && scene.canonical) ? scene.canonicalIndex : STATE.canonicalProgress;
    var hudPT = el('hud-progress-text');
    var hudS  = el('hud-score');
    var hudPB = el('hud-progress-bar');
    if (hudPT) hudPT.textContent = idx + ' / ' + CANONICAL_SCENE_COUNT;
    if (hudS)  hudS.textContent  = STATE.score + ' pts';
    if (hudPB) hudPB.style.width = ((idx / CANONICAL_SCENE_COUNT) * 100) + '%';
    updateTemperatureBar();
    updateMinimap();
    updateDecisionTracker();
  }

  function updateTemperatureBar() {
    var t = Math.max(0, Math.min(4, STATE.groupTemperature - 1));
    var icon  = el('temp-icon');
    var label = el('temp-label');
    var fill  = el('temp-fill');
    if (icon)  icon.textContent = TEMP_ICONS[t];
    if (label) label.textContent = TEMP_LABELS[t];
    if (fill) {
      fill.style.height = ((t + 1) * 20) + '%';
      fill.style.backgroundColor = TEMP_COLORS[t];
    }
  }

  function updateMinimap() {
    var mm = el('minimap');
    if (!mm) return;
    mm.querySelectorAll('[data-scene]').forEach(function (n) {
      var sid = n.getAttribute('data-scene');
      n.className = 'mm-node' + (BRANCH_SCENES.indexOf(sid) >= 0 ? ' mm-branch' : '');
      if (n.textContent.indexOf('★') >= 0) n.classList.add('mm-star');
      if (sid === STATE.currentScene) n.classList.add('mm-current');
      else if (STATE.decisions.some(function (d) { return d.scene === sid; })) n.classList.add('mm-visited');
    });
  }

  function updateDecisionTracker() {
    var tracker = el('decision-tracker');
    if (!tracker) return;
    var relevant = STATE.decisions.filter(function (d) {
      return d.type === 'decision' || d.type === 'quiz' || d.type === 'dialogue';
    }).slice(-3);
    tracker.innerHTML = '';
    relevant.forEach(function (d) {
      var span = make('span', 'dt-icon');
      if (d.type === 'quiz') {
        span.textContent = d.correct ? '✓' : '✗';
        span.title = d.correct ? 'Quiz correcto' : 'Quiz incorrecto';
      } else {
        var v = d.value || '';
        if (v.slice(-2) === '_A') { span.textContent = 'T'; span.title = 'Transformacional'; }
        else if (v.slice(-2) === '_C') { span.textContent = 'S'; span.title = 'Situacional'; }
        else { span.textContent = 'R'; span.title = 'Reactivo/Evasivo'; }
      }
      tracker.appendChild(span);
    });
  }

  /* ══════════════════════════════════════════════════════
     RENDERIZADO — TRANSICIÓN (FIX: opacity inline, sin CSS classes)
  ══════════════════════════════════════════════════════ */
  function renderScene(sceneId) {
    var scene = SCENES[sceneId];
    if (!scene) { return; }

    STATE.currentScene = sceneId;
    if (scene.canonical) STATE.canonicalProgress = scene.canonicalIndex;

    var container = el('scene-container');

    /* Fade-out rápido usando estilo inline — evita el bug de forwards-fill */
    container.style.transition = 'opacity 0.18s ease';
    container.style.opacity = '0';
    container.style.transform = 'translateY(6px)';

    setTimeout(function () {
      /* Reconstruir contenido */
      container.innerHTML = '';
      container.removeAttribute('style');
      if (scene.specialFX) container.classList.add('scene-cold');
      else container.classList.remove('scene-cold');

      buildSceneDOM(scene, container);
      updateHUD();

      /* Aplicar temporizador antiavance 30s */
      var lockSecs = BRANCH_SCENES.indexOf(sceneId) >= 0 ? 15 : READING_SECONDS;
      applyReadingLock(container, lockSecs, scene);

      /* Fade-in con requestAnimationFrame doble para garantizar repaint */
      container.style.opacity = '0';
      container.style.transform = 'translateY(10px)';
      container.style.transition = 'none';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          container.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
          container.style.opacity = '1';
          container.style.transform = 'translateY(0)';
        });
      });
    }, 200);
  }

  /* ══════════════════════════════════════════════════════
     TEMPORIZADOR ANTIAVANCE — 30 segundos
  ══════════════════════════════════════════════════════ */
  function applyReadingLock(container, seconds, scene) {
    /* Recopilar todos los botones interactivos en actividades */
    var actBtns = Array.prototype.slice.call(
      container.querySelectorAll('.activity-wrapper button, .activity-wrapper input')
    );
    if (actBtns.length === 0) return;

    /* Deshabilitar todos */
    actBtns.forEach(function (b) { b.disabled = true; b.classList.add('btn-locked'); });

    /* Insertar barra de temporizador antes de la primera actividad */
    var firstAct = container.querySelector('.activity-wrapper');
    var timerEl = make('div', 'reading-timer');
    var trackEl = make('div', 'rt-track');
    var fillEl  = make('div', 'rt-fill');
    var labelEl = make('div', 'rt-label');
    labelEl.innerHTML = '<span class="rt-icon">⏱</span> Lee el texto antes de responder &mdash; <strong class="rt-count">' + seconds + 's</strong>';
    trackEl.appendChild(fillEl);
    timerEl.appendChild(trackEl);
    timerEl.appendChild(labelEl);
    firstAct.insertBefore(timerEl, firstAct.firstChild);

    var remaining = seconds;
    var countEl = timerEl.querySelector('.rt-count');

    var interval = setInterval(function () {
      remaining--;
      fillEl.style.width = (((seconds - remaining) / seconds) * 100) + '%';
      if (countEl) countEl.textContent = Math.max(0, remaining) + 's';

      if (remaining <= 0) {
        clearInterval(interval);
        labelEl.innerHTML = '<span class="rt-icon" style="color:#27AE60">✓</span> <strong>Puedes responder ahora</strong>';
        timerEl.classList.add('rt-done');
        setTimeout(function () {
          timerEl.style.transition = 'opacity 0.4s ease';
          timerEl.style.opacity = '0';
          setTimeout(function () { timerEl.remove(); }, 400);
          /* Habilitar botones */
          actBtns.forEach(function (b) {
            b.disabled = false;
            b.classList.remove('btn-locked');
          });
          /* E03: arrancar countdown narrativo DESPUÉS del lock */
          if (scene && scene.specialFX) {
            var cdBar = container.querySelector('.countdown-bar');
            if (cdBar && cdBar._startFn) cdBar._startFn();
          }
        }, 600);
      }
    }, 1000);
  }

  /* ══════════════════════════════════════════════════════
     CONSTRUCCIÓN DE ESCENA
  ══════════════════════════════════════════════════════ */
  function buildSceneDOM(scene, container) {
    /* Cabecera */
    var header = make('div', 'scene-header');
    var etag = make('span', 'emotion-tag emotion-' + scene.emotionIcon);
    etag.textContent = emotionIconLabel(scene.emotionIcon);
    header.appendChild(etag);
    var titleEl = make('h1', 'scene-title');
    titleEl.textContent = scene.title;
    header.appendChild(titleEl);
    var actEl = make('p', 'scene-act');
    actEl.textContent = scene.act;
    header.appendChild(actEl);
    container.appendChild(header);

    /* Narrativa */
    if (scene.narrative && scene.narrative.length) {
      var narDiv = make('div', 'narrative');
      scene.narrative.forEach(function (line) {
        var p = document.createElement('p');
        p.innerHTML = line;
        narDiv.appendChild(p);
      });
      container.appendChild(narDiv);
    }

    /* Bloque pedagógico (E02) */
    if (scene.pedagogicalBlock) {
      var pb = make('div', 'pedagogical-block');
      var pbT = make('h3', 'pb-title');
      pbT.textContent = scene.pedagogicalBlock.title;
      pb.appendChild(pbT);
      var ol = document.createElement('ol');
      scene.pedagogicalBlock.items.forEach(function (item) {
        var li = document.createElement('li');
        li.innerHTML = item;
        ol.appendChild(li);
      });
      pb.appendChild(ol);
      container.appendChild(pb);
    }

    /* Cita */
    if (scene.quote) {
      var q = make('blockquote', 'scene-quote');
      q.innerHTML = scene.quote;
      container.appendChild(q);
    }

    /* Resumen de camino alternativo (convergencias) */
    if (scene.isConvergence && scene.alternativePath) {
      container.appendChild(buildAltPathCard(scene));
    }

    /* Actividad principal
       E06 es especial: solo mostramos la actividad de subtexto;
       la decisionActivity se inyecta después del confirm. */
    if (scene.activity) {
      container.appendChild(buildActivity(scene.activity, scene));
    }

    /* Frase de gancho */
    if (scene.hookLine) {
      var hook = make('div', 'hook-line');
      hook.textContent = scene.hookLine;
      container.appendChild(hook);
    }
  }

  /* ══════════════════════════════════════════════════════
     CAMINO ALTERNATIVO
  ══════════════════════════════════════════════════════ */
  function buildAltPathCard(scene) {
    var card = make('div', 'alt-path-card');
    var btn = make('button', 'alt-path-toggle');
    btn.textContent = '🗺  Ver el otro camino';
    var content = make('div', 'alt-path-content');
    content.style.display = 'none';

    var pathData;
    if (scene.id === 'E07') {
      pathData = STATE.routeTaken === 'A' ? scene.alternativePath.forRouteA : scene.alternativePath.forRouteB;
    } else {
      pathData = scene.alternativePath;
    }

    if (pathData && pathData.text) {
      var pt = make('h4', 'alt-path-title');
      pt.textContent = pathData.title || 'Otro camino';
      content.appendChild(pt);
      var pp = make('p', '');
      pp.textContent = pathData.text;
      content.appendChild(pp);
    }

    btn.addEventListener('click', function () {
      var hidden = content.style.display === 'none';
      content.style.display = hidden ? 'block' : 'none';
      btn.textContent = hidden ? '🗺  Cerrar' : '🗺  Ver el otro camino';
      if (hidden && !STATE.alternativePathViewed) {
        STATE.alternativePathViewed = true;
        STATE.score += 3;
        var hs = el('hud-score');
        if (hs) hs.textContent = STATE.score + ' pts';
        SCORM.saveState(STATE);
      }
    });

    card.appendChild(btn);
    card.appendChild(content);
    return card;
  }

  /* ══════════════════════════════════════════════════════
     DISPATCHER DE ACTIVIDADES
  ══════════════════════════════════════════════════════ */
  function buildActivity(act, scene) {
    var wrapper = make('div', 'activity-wrapper');
    var prompt = make('p', 'activity-prompt');
    prompt.textContent = act.prompt;
    wrapper.appendChild(prompt);

    switch (act.type) {
      case 'thermometer':     wrapper.appendChild(buildThermometer(act)); break;
      case 'decision':        wrapper.appendChild(buildDecision(act, scene)); break;
      case 'dialogue':        wrapper.appendChild(buildDecision(act, scene)); break;
      case 'quiz':            wrapper.appendChild(buildQuiz(act, scene)); break;
      case 'dragdrop':        wrapper.appendChild(buildDragDrop(act, scene)); break;
      case 'subtextIdentify': wrapper.appendChild(buildSubtext(act, scene)); break;
      case 'wordAnchor':      wrapper.appendChild(buildWordAnchor(act)); break;
      case 'info':            wrapper.appendChild(buildInfo(act, scene)); break;
    }
    return wrapper;
  }

  /* ── Termómetro ── */
  function buildThermometer(act) {
    var div = make('div', 'thermometer-activity');
    for (var i = 1; i <= act.scale; i++) {
      (function (val) {
        var btn = make('button', 'thermo-btn');
        btn.innerHTML = '<span class="thermo-num">' + val + '</span>' +
                        '<span class="thermo-label">' + act.labels[val - 1] + '</span>';
        btn.addEventListener('click', function () {
          div.querySelectorAll('.thermo-btn').forEach(function (b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          div.querySelectorAll('.thermo-btn').forEach(function (b) { b.disabled = true; });
          setTimeout(function () { act.onSelect(val); }, 350);
        });
        div.appendChild(btn);
      }(i));
    }
    return div;
  }

  /* ── Decisión / Diálogo ── */
  function buildDecision(act, scene) {
    var div = make('div', 'decision-activity');

    /* Countdown E03: se construye pero NO arranca hasta que el lock lo active */
    var cdBar = null;
    if (scene && scene.specialFX && act.countdown) {
      cdBar = make('div', 'countdown-bar');
      var cdFill = make('div', 'countdown-fill');
      cdFill.style.width = '100%';
      cdBar.appendChild(cdFill);
      var cdLabel = make('span', 'countdown-label');
      cdLabel.textContent = 'Jordi tiene ' + act.countdown + ' segundos para decidir.';
      cdBar.appendChild(cdLabel);
      div.appendChild(cdBar);

      var cdTotal = act.countdown;
      var cdInterval = null;
      cdBar._startFn = function () {
        var rem = cdTotal;
        cdInterval = setInterval(function () {
          rem--;
          cdFill.style.width = ((rem / cdTotal) * 100) + '%';
          cdLabel.textContent = 'Jordi tiene ' + rem + ' segundo' + (rem !== 1 ? 's' : '') + '.';
          if (rem <= 0) clearInterval(cdInterval);
        }, 1000);
      };
    }

    act.options.forEach(function (opt) {
      var btn = make('button', 'decision-btn');
      btn.textContent = opt.label;
      btn.addEventListener('click', function () {
        if (cdInterval) clearInterval(cdInterval);

        /* Bloquear todos los botones de decisión */
        div.querySelectorAll('.decision-btn').forEach(function (b) { b.disabled = true; });
        btn.classList.add('selected');

        /* Registrar decisión */
        STATE.decisions.push({ scene: scene.id, type: act.type, value: opt.id });
        if (opt.score) STATE.score += opt.score;
        if (opt.badge) unlockBadge(opt.badge);
        if (opt.routeTag) STATE.routeTaken = opt.routeTag;

        /* Temperatura */
        if (scene.temperatureChange && scene.temperatureChange[opt.id] !== undefined) {
          STATE.groupTemperature = Math.max(1, Math.min(5,
            STATE.groupTemperature + scene.temperatureChange[opt.id]));
        }
        updateHUD();

        /* Texto seleccionado */
        var selText = make('p', 'option-text-display');
        selText.innerHTML = '<em>"' + opt.text + '"</em>';
        div.appendChild(selText);

        /* Feedback */
        var fb = make('div', 'feedback-block');
        var fbt = make('p', 'feedback-text');
        fbt.textContent = opt.feedback;
        fb.appendChild(fbt);
        if (opt.feedbackConcept) {
          var fbc = make('p', 'feedback-concept');
          fbc.textContent = opt.feedbackConcept;
          fb.appendChild(fbc);
        }
        div.appendChild(fb);

        /* Botón continuar */
        var nextBtn = make('button', 'btn-next');
        nextBtn.textContent = 'Continuar →';
        nextBtn.addEventListener('click', function () {
          saveAndAdvance(opt.nextScene);
        });
        div.appendChild(nextBtn);
      });
      div.appendChild(btn);
    });
    return div;
  }

  /* ── Quiz ── */
  function buildQuiz(act, scene) {
    var div = make('div', 'quiz-activity');
    var answered = false;

    act.options.forEach(function (opt) {
      var btn = make('button', 'quiz-btn');
      btn.textContent = opt.text;
      btn.setAttribute('data-id', opt.id);
      btn.addEventListener('click', function () {
        if (answered) return;
        answered = true;
        div.querySelectorAll('.quiz-btn').forEach(function (b) { b.disabled = true; });

        btn.classList.add(opt.correct ? 'correct' : 'incorrect');
        if (!opt.correct) {
          div.querySelectorAll('.quiz-btn').forEach(function (b) {
            var oid = b.getAttribute('data-id');
            if (act.options.some(function (o) { return o.id === oid && o.correct; })) {
              b.classList.add('correct-reveal');
            }
          });
        }

        if (opt.correct) {
          STATE.score += act.score;
          if (act.badgeOnCorrect) unlockBadge(act.badgeOnCorrect);
        }
        STATE.decisions.push({ scene: scene.id, type: 'quiz', value: opt.id, correct: opt.correct });
        updateHUD();

        var fb = make('div', 'feedback-block');
        var fbt = make('p', 'feedback-text');
        fbt.textContent = opt.correct ? act.feedbackCorrect : act.feedbackIncorrect;
        fb.appendChild(fbt);
        div.appendChild(fb);

        var nextBtn = make('button', 'btn-next');
        nextBtn.textContent = 'Continuar →';
        nextBtn.addEventListener('click', function () {
          saveAndAdvance(act.next);  /* FIX: usa act.next, no hardcodeado */
        });
        div.appendChild(nextBtn);
      });
      div.appendChild(btn);
    });
    return div;
  }

  /* ── Drag & Drop ── */
  function buildDragDrop(act, scene) {
    var div = make('div', 'dragdrop-activity');
    var listEl = make('ul', 'dd-list');
    var currentOrder = act.items.slice();
    var selectedIdx = null;

    function renderItems() {
      listEl.innerHTML = '';
      currentOrder.forEach(function (item, idx) {
        var li = make('li', 'dd-item' + (selectedIdx === idx ? ' dd-selected' : ''));
        li.setAttribute('draggable', 'true');
        li.innerHTML = '<span class="dd-num">' + (idx + 1) + '.</span> ' + item.text;

        li.addEventListener('click', function () {
          if (selectedIdx === null) {
            selectedIdx = idx; renderItems();
          } else if (selectedIdx === idx) {
            selectedIdx = null; renderItems();
          } else {
            var tmp = currentOrder[selectedIdx];
            currentOrder[selectedIdx] = currentOrder[idx];
            currentOrder[idx] = tmp;
            selectedIdx = null; renderItems();
          }
        });
        li.addEventListener('dragstart', function () { selectedIdx = idx; li.classList.add('dragging'); });
        li.addEventListener('dragend',   function () { li.classList.remove('dragging'); });
        li.addEventListener('dragover',  function (e) { e.preventDefault(); });
        li.addEventListener('drop',      function (e) {
          e.preventDefault();
          if (selectedIdx !== null && selectedIdx !== idx) {
            var tmp = currentOrder[selectedIdx];
            currentOrder[selectedIdx] = currentOrder[idx];
            currentOrder[idx] = tmp;
            selectedIdx = null; renderItems();
          }
        });
        listEl.appendChild(li);
      });
    }
    renderItems();
    div.appendChild(listEl);

    var hint = make('p', 'dd-hint');
    hint.textContent = 'Haz clic en dos elementos para intercambiarlos, o arrástralos.';
    div.appendChild(hint);

    var confirmBtn = make('button', 'btn-confirm');
    confirmBtn.textContent = 'Confirmar orden';
    confirmBtn.addEventListener('click', function () {
      confirmBtn.disabled = true;
      var orderIds = currentOrder.map(function (i) { return i.id; });
      STATE.decisions.push({ scene: scene.id, type: 'dragdrop', value: orderIds });

      var fb = make('div', 'feedback-block');
      var fbt = make('p', 'feedback-text');
      fbt.textContent = act.feedback;
      fb.appendChild(fbt);
      div.appendChild(fb);

      var nextBtn = make('button', 'btn-next');
      nextBtn.textContent = 'Continuar →';
      nextBtn.addEventListener('click', function () {
        saveAndAdvance(act.next);  /* FIX: usa act.next, no hardcodeado */
      });
      div.appendChild(nextBtn);
    });
    div.appendChild(confirmBtn);
    return div;
  }

  /* ── Identificar Subtexto (E06) ── */
  function buildSubtext(act, scene) {
    var div = make('div', 'subtext-activity');
    var results = {};
    var labels = {
      necesita_ayuda:  'Necesita ayuda',
      a_punto_de_irse: 'A punto de irse',
      observa_y_sabe:  'Observa y sabe'
    };

    act.characters.forEach(function (char) {
      var card = make('div', 'subtext-card');
      var nameEl = make('strong', 'subtext-name');
      nameEl.textContent = char.name;
      card.appendChild(nameEl);
      var reactEl = make('p', 'subtext-reaction');
      reactEl.textContent = char.reaction;
      card.appendChild(reactEl);
      var btnRow = make('div', 'subtext-btns');
      Object.keys(labels).forEach(function (key) {
        var btn = make('button', 'subtext-btn');
        btn.textContent = labels[key];
        btn.addEventListener('click', function () {
          card.querySelectorAll('.subtext-btn').forEach(function (b) {
            b.classList.remove('selected', 'correct', 'incorrect');
          });
          btn.classList.add('selected');
          btn.classList.add(key === char.truth ? 'correct' : 'incorrect');
          results[char.name] = key;
        });
        btnRow.appendChild(btn);
      });
      card.appendChild(btnRow);
      div.appendChild(card);
    });

    var confirmBtn = make('button', 'btn-confirm');
    confirmBtn.textContent = 'Confirmar lectura del grupo';
    confirmBtn.addEventListener('click', function () {
      confirmBtn.disabled = true;
      STATE.decisions.push({ scene: scene.id, type: 'subtext', value: results });

      var fb = make('div', 'feedback-block');
      fb.innerHTML = '<p><strong>Buena lectura del subtexto.</strong> Ahora decide qué hace Jordi.</p>';
      div.appendChild(fb);

      /* FIX E06: inyectar la decisionActivity DESPUÉS del confirm */
      if (scene.decisionActivity) {
        var decWrapper = buildActivity(scene.decisionActivity, scene);
        var container = el('scene-container');
        /* Insertar antes del hook-line (último elemento) */
        var hook = container.querySelector('.hook-line');
        if (hook) container.insertBefore(decWrapper, hook);
        else container.appendChild(decWrapper);
        /* Los botones de la decisión NO pasan por el lock inicial, ya están desbloqueados */
      }
    });
    div.appendChild(confirmBtn);
    return div;
  }

  /* ── Word Anchor ── */
  function buildWordAnchor(act) {
    var div = make('div', 'word-anchor-activity');
    act.words.forEach(function (word) {
      var btn = make('button', 'word-btn');
      btn.textContent = word;
      btn.addEventListener('click', function () {
        div.querySelectorAll('.word-btn').forEach(function (b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        var old = div.querySelector('.word-anchor-result');
        if (old) old.remove();
        var res = make('div', 'word-anchor-result');
        res.innerHTML = '<p><strong>' + word + ':</strong> ' + act.anchors[word] + '</p>';
        div.appendChild(res);
        var existing = div.querySelector('.btn-next');
        if (!existing) {
          var nextBtn = make('button', 'btn-next');
          nextBtn.textContent = 'Continuar →';
          nextBtn.addEventListener('click', function () { act.onSelect(word); });
          div.appendChild(nextBtn);
        }
      });
      div.appendChild(btn);
    });
    return div;
  }

  /* ── Info (solo botón de avance) ── */
  function buildInfo(act, scene) {
    var div = make('div', 'info-activity');
    var btn = make('button', 'btn-next btn-large');
    btn.textContent = act.buttonLabel || 'Continuar →';
    btn.addEventListener('click', function () {
      /* FIX: usa act.next si está definido; si no, act.onSelect heredado */
      if (act.next) saveAndAdvance(act.next);
      else if (act.onSelect) act.onSelect();
    });
    div.appendChild(btn);
    return div;
  }

  /* ══════════════════════════════════════════════════════
     EPÍLOGO FINAL
  ══════════════════════════════════════════════════════ */
  function showFinalEpilogue() {
    var key  = getEpilogueKey();
    var epi  = EPILOGUES[key];
    var container = el('scene-container');
    container.innerHTML = '';
    container.removeAttribute('style');
    container.className = 'scene-final';

    var screen = make('div', 'results-screen');

    var ptitle = make('h2', 'results-profile-title');
    ptitle.textContent = 'Perfil de Liderazgo Desbloqueado';
    screen.appendChild(ptitle);

    var pname = make('div', 'results-profile-name profile-' + STATE.leadershipProfile);
    pname.textContent = epi.title;
    screen.appendChild(pname);

    var strack = make('div', 'results-score-bar');
    var sfill  = make('div', 'results-score-fill');
    sfill.style.width = '0%';
    strack.appendChild(sfill);
    screen.appendChild(strack);
    setTimeout(function () { sfill.style.width = Math.min(STATE.score, 100) + '%'; }, 300);

    var slabel = make('p', 'results-score-label');
    slabel.textContent = 'Puntuación: ' + STATE.score + ' / 100';
    screen.appendChild(slabel);

    /* Badges */
    if (STATE.badgesUnlocked.length) {
      var brow = make('div', 'results-badges');
      STATE.badgesUnlocked.forEach(function (bid) {
        var bd = BADGE_DEFS[bid];
        if (!bd) return;
        var bel = make('div', 'badge-display');
        bel.innerHTML = bd.icon + ' <span>' + bd.label + '</span>';
        brow.appendChild(bel);
      });
      screen.appendChild(brow);
    }

    var textEl = make('div', 'results-text');
    textEl.textContent = epi.text;
    screen.appendChild(textEl);

    var conceptEl = make('p', 'results-concept');
    conceptEl.innerHTML = '<strong>Concepto de liderazgo:</strong> ' + epi.concept;
    screen.appendChild(conceptEl);

    var actionEl = make('div', 'results-action');
    actionEl.innerHTML = '<strong>Recomendación post-curso:</strong> ' + epi.action;
    screen.appendChild(actionEl);

    var eqEl = make('blockquote', 'results-endquestion');
    eqEl.textContent = epi.endQuestion;
    screen.appendChild(eqEl);

    /* Tres finales comparados */
    var altSum = make('div', 'alt-paths-summary');
    altSum.innerHTML = '<h4>Los tres caminos posibles</h4>';
    ['A', 'B', 'C'].forEach(function (k) {
      var ep2 = EPILOGUES[k];
      var mc = make('div', 'alt-path-mini' + (k === key ? ' highlight' : ''));
      mc.innerHTML = '<strong>' + ep2.title + '</strong> <small>' + ep2.scoreRange + '</small>' +
                     '<p>' + ep2.text.substring(0, 130) + '…</p>';
      altSum.appendChild(mc);
    });
    screen.appendChild(altSum);

    var restartBtn = make('button', 'btn-restart');
    restartBtn.textContent = 'Volver a empezar desde E01';
    restartBtn.addEventListener('click', function () {
      resetState();
      SCORM.saveState(STATE);
      renderScene('E01');
    });
    screen.appendChild(restartBtn);

    container.appendChild(screen);

    /* Marcar completado en SCORM */
    STATE.completed = true;
    SCORM.saveState(STATE);
    SCORM.finish();
  }

  /* ══════════════════════════════════════════════════════
     BADGE NOTIFICATION
  ══════════════════════════════════════════════════════ */
  function showBadgeNotification(badgeId) {
    var bd = BADGE_DEFS[badgeId];
    if (!bd) return;
    var notif = make('div', 'badge-notification');
    notif.innerHTML = '<span class="badge-icon">' + bd.icon + '</span>' +
                      '<span class="badge-label">+<strong>' + bd.label + '</strong> desbloqueado</span>';
    document.body.appendChild(notif);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { notif.classList.add('show'); });
    });
    setTimeout(function () {
      notif.classList.remove('show');
      setTimeout(function () { notif.remove(); }, 400);
    }, 3000);
  }

  /* ══════════════════════════════════════════════════════
     RESET
  ══════════════════════════════════════════════════════ */
  function resetState() {
    STATE.currentScene = 'E01';
    STATE.score = 0;
    STATE.decisions = [];
    STATE.leadershipProfile = 'none';
    STATE.badgesUnlocked = [];
    STATE.groupTemperature = 3;
    STATE.alternativePathViewed = false;
    STATE.routeTaken = 'A';
    STATE.canonicalProgress = 0;
    STATE.completed = false;
  }

  /* ══════════════════════════════════════════════════════
     INIT
  ══════════════════════════════════════════════════════ */
  function init() {
    SCORM.initialize();
    var saved = SCORM.loadState();
    if (saved && typeof saved === 'object') {
      /* Restaurar solo campos primitivos/arrays, no funciones */
      var safe = ['currentScene','score','decisions','leadershipProfile',
                  'badgesUnlocked','groupTemperature','alternativePathViewed',
                  'routeTaken','canonicalProgress','completed'];
      safe.forEach(function (k) {
        if (saved[k] !== undefined) STATE[k] = saved[k];
      });
    }
    renderScene(STATE.currentScene);
  }

  document.addEventListener('DOMContentLoaded', init);

}());

  </script>
</body>
</html>
